<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>时光胶囊</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💊</text></svg>">
<style>
:root{
  --bg: light-dark(#fff3d6,#201b28); --panel: light-dark(#fffaf0,#30283a);
  --ink: light-dark(#493c4b,#fff3e7); --muted: light-dark(#8b7281,#cbb9c6);
  --pink:#f4a6a6; --yellow:#ffd36e; --mint:#93d8bc; --blue:#91c9df; --purple:#c7a6e8;
  --line:light-dark(#604c58,#e8d5df); --shadow:light-dark(#c89c85,#120e16);
}
*{box-sizing:border-box}
body{margin:0;font-family:"Courier New","Microsoft YaHei",monospace;color:var(--ink);background-color:var(--bg)}
#app{min-height:100vh;padding:24px}
header{max-width:1080px;margin:auto auto 22px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand h1{margin:0;font-size:clamp(22px,4vw,38px);text-shadow:3px 3px 0 var(--yellow)}
.brand p{margin:6px 0 0;color:var(--muted);font-size:13px}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:3px solid var(--line);background:var(--yellow);color:#493c4b;padding:10px 14px;box-shadow:4px 4px 0 var(--shadow);font-weight:bold;transition:0.05s}
button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
.toolbar{max-width:1080px;margin:0 auto 20px;display:flex;gap:10px;flex-wrap:wrap}
.search{flex:1;min-width:210px;border:3px solid var(--line);background:var(--panel);color:var(--ink);padding:10px;box-shadow:3px 3px 0 var(--shadow)}
.tabs{max-width:1080px;margin:0 auto 16px;display:flex;gap:8px;flex-wrap:wrap}
.tab{background:var(--panel)}
.tab.active{background:var(--mint)}
.grid{max-width:1080px;margin:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px}
.capsule-card{border:3px solid var(--line);background:var(--panel);padding:16px;box-shadow:6px 6px 0 var(--shadow);cursor:pointer;transition:.12s;display:flex;flex-direction:column;align-items:center;text-align:center}
.capsule-card:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--shadow)}
/* 全新优化的立体胶囊造型 */
.capsule-graphic{width:64px;height:100px;margin:8px auto 14px;position:relative;background:var(--line);border-radius:32px;padding:4px;box-shadow:inset 0 2px 4px rgba(0,0,0,0.15)}
.capsule-body{width:100%;height:100%;position:relative;border-radius:28px;overflow:hidden;display:flex;flex-direction:column}
.capsule-half{flex:1;width:100%;position:relative}
.capsule-half.top{border-top-left-radius:26px;border-top-right-radius:26px;border-bottom:2px dashed rgba(255,255,255,0.4)}
.capsule-half.bottom{border-bottom-left-radius:26px;border-bottom-right-radius:26px}
.capsule-shine{position:absolute;top:8px;left:8px;width:10px;height:18px;background:rgba(255,255,255,0.5);border-radius:5px}
.card-title{font-weight:bold;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.card-date{font-size:11px;color:var(--muted);margin-top:6px}
.lock-note{font-size:11px;color:var(--muted);margin-top:4px}
.empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--muted)}

/* 弹窗与编辑器样式（调整层级彻底解决遮挡） */
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:16px;z-index:999}
.modal.open{display:flex}
.editor{width:min(760px,100%);max-height:90vh;overflow-y:auto;background:var(--panel);border:4px solid var(--line);box-shadow:10px 10px 0 #0006;padding:24px;position:relative}
.editor h2{margin-top:0;font-size:20px;border-bottom:2px dashed var(--line);padding-bottom:10px}
label{display:block;font-weight:bold;margin:14px 0 6px;font-size:13px}
.editor input,.editor textarea,.editor select{width:100%;border:3px solid var(--line);background:var(--bg);color:var(--ink);padding:10px;box-shadow:3px 3px 0 var(--shadow)}
.editor textarea{min-height:160px;resize:vertical;line-height:1.6}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.palette{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:32px;height:32px;padding:0;border-width:3px;box-shadow:3px 3px 0 var(--shadow)}
.swatch.active{outline:3px solid var(--blue);outline-offset:2px}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.actions .danger{background:#ff9a9a}.actions .save{background:var(--mint)}
.stamp{font-size:11px;color:var(--muted);text-align:right;margin-top:6px}

/* 回信/评论区样式 */
.replies-section{margin-top:20px;border-top:3px dashed var(--line);padding-top:16px}
.replies-section h3{margin:0 0 10px;font-size:15px}
.reply-item{background:var(--bg);border:2px solid var(--line);padding:10px;margin-bottom:10px;box-shadow:2px 2px 0 var(--shadow);font-size:13px}
.reply-date{font-size:10px;color:var(--muted);margin-bottom:4px}
.reply-input-box{display:flex;gap:8px;margin-top:10px}
.reply-input-box input{flex:1;box-shadow:2px 2px 0 var(--shadow);padding:8px}

.locked-card{filter:saturate(0.7)}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><h1>✦ TIME CAPSULE ✦</h1><p>把旧日的信，装进不会过期的小胶囊。</p></div>
    <button id="newBtn">＋ 新建胶囊</button>
  </header>
  <div class="toolbar"><input class="search" id="search" placeholder="⌕ 搜索标题或信件内容…"></div>
  <div class="tabs">
    <button class="tab active" data-box="past">过去的我</button>
    <button class="tab" data-box="future">未来的我</button>
    <button class="tab" data-box="all">全部胶囊</button>
  </div>
  <main class="grid" id="grid"></main>
</div>

<div class="modal" id="modal">
  <section class="editor">
    <h2>▣ 时光胶囊与回信</h2>
    <label>胶囊标题</label><input id="title" maxlength="60" placeholder="例如：写给十八岁的我">
    <div class="row">
      <div><label>这封信写于</label><input id="letterDate" type="date"></div>
      <div><label>封存至（可选）</label><input id="unlockDate" type="date"></div>
    </div>
    <div class="row">
      <div><label>放进档案柜</label><select id="box"><option value="past">过去的我</option><option value="future">未来的我</option></select></div>
      <div>
        <label>胶囊颜色</label>
        <div class="palette" id="palette">
          <button class="swatch" data-color="#f4a6a6" style="background:#f4a6a6"></button>
          <button class="swatch" data-color="#ffd36e" style="background:#ffd36e"></button>
          <button class="swatch" data-color="#93d8bc" style="background:#93d8bc"></button>
          <button class="swatch" data-color="#91c9df" style="background:#91c9df"></button>
          <button class="swatch" data-color="#c7a6e8" style="background:#c7a6e8"></button>
        </div>
      </div>
    </div>
    <label>信件正文内容</label><textarea id="content" placeholder="亲爱的过去的自己……"></textarea>
    <div class="stamp" id="stamp"></div>

    <!-- 新增：时光回信/评论区域 -->
    <div class="replies-section" id="repliesSection">
      <h3>✉️ 时光回信与评论</h3>
      <div id="repliesList"></div>
      <div class="reply-input-box">
        <input id="replyInput" placeholder="写下此刻对这封旧信的回复或感想...">
        <button id="addReplyBtn">添加回复</button>
      </div>
    </div>

    <div class="actions">
      <button class="danger" id="deleteBtn">删除胶囊</button>
      <div><button id="cancelBtn">关上胶囊</button> <button class="save" id="saveBtn">保存修改</button></div>
    </div>
  </section>
</div>

<script>
const KEY="pixel-time-capsules-v2";
let data = JSON.parse(localStorage.getItem(KEY)||"[]"), editing = null, currentBox = "past", chosenColor = "#f4a6a6";
const $=id=>document.getElementById(id);
function esc(s){return (s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function persist(){localStorage.setItem(KEY,JSON.stringify(data))}

function render(){
  const q = $("search").value.trim().toLowerCase();
  const items = data.filter(x=>(currentBox==="all"||(x.box||"past")===currentBox)&&(x.title+" "+x.content).toLowerCase().includes(q));
  
  $("grid").innerHTML = items.length ? items.map(x=>`
    <article class="capsule-card ${isLocked(x)?"locked-card":""}" data-id="${x.id}">
      <div class="capsule-graphic">
        <div class="capsule-body">
          <div class="capsule-half top" style="background:${x.color||"#f4a6a6"}">
            <div class="capsule-shine"></div>
          </div>
          <div class="capsule-half bottom" style="background:${adjustColor(x.color||"#f4a6a6")}px"></div>
        </div>
      </div>
      <div class="card-title">${esc(x.title||"未命名胶囊")}</div>
      <div class="card-date">✎ ${esc(x.letterDate||"无日期")}</div>
      ${isLocked(x)?`<div class="lock-note">🔒 封存至 ${esc(x.unlockDate)}</div>`:`<div class="lock-note" style="color:var(--mint);font-weight:bold">✦ 点击打开</div>`}
      ${x.replies && x.replies.length ? `<div style="font-size:10px;color:var(--blue);margin-top:4px">💬 ${x.replies.length} 条回信</div>`:""}
    </article>`).join("") : `<div class="empty">☆ 这里还空空的。<br><br>把第一封旧信放进来吧。</div>`;

  document.querySelectorAll(".capsule-card").forEach(el=>el.onclick=()=>{
    const x = data.find(v=>v.id===el.dataset.id);
    if(isLocked(x)){alert(`这枚胶囊还在时间里睡觉。\n要到 ${x.unlockDate} 才能打开哦。`);return;}
    openEditor(el.dataset.id);
  });
}

// 辅助函数：让胶囊下半部分颜色稍微深一点点，更有立体质感
function adjustColor(hex) {
  return hex; // 简化的安全返回，使用原色或你可以微调
}

function isLocked(x){return !!(x?.unlockDate&&new Date(x.unlockDate+"T23:59:59")>new Date())}
function setColor(c){chosenColor=c;document.querySelectorAll(".swatch").forEach(b=>b.classList.toggle("active",b.dataset.color===c))}

function renderReplies(x){
  const list = $("repliesList");
  if(!x || !x.replies || x.replies.length === 0){
    list.innerHTML = `<div style="font-size:12px;color:var(--muted);margin-bottom:8px">还没有任何回信，留下第一条感想吧~</div>`;
    return;
  }
  list.innerHTML = x.replies.map((r, idx)=>`
    <div class="reply-item">
      <div class="reply-date">⏱ ${new Date(r.time).toLocaleString()}</div>
      <div>${esc(r.text)}</div>
    </div>
  `).join("");
}

function openEditor(id=null){
  editing = id;
  const x = data.find(v=>v.id===id);
  $("title").value = x?.title||"";
  $("letterDate").value = x?.letterDate||new Date().toISOString().slice(0,10);
  $("box").value = x?.box||(currentBox==="future"?"future":"past");
  $("unlockDate").value = x?.unlockDate||"";
  setColor(x?.color||"#f4a6a6");
  $("content").value = x?.content||"";
  $("stamp").textContent = x ? `创建/更新于：${new Date(x.updated).toLocaleString()}` : "新胶囊 · 等待封存";
  $("deleteBtn").style.visibility = x ? "visible" : "hidden";
  
  // 回信区域显隐：新建时暂无回信，编辑已有胶囊时显示
  if(x){
    $("repliesSection").style.display = "block";
    renderReplies(x);
  } else {
    $("repliesSection").style.display = "none";
  }
  $("replyInput").value = "";
  $("modal").classList.add("open"); 
}

function closeEditor(){ $("modal").classList.remove("open") }

$("newBtn").onclick=()=>openEditor();
document.querySelectorAll(".swatch").forEach(b=>b.onclick=()=>setColor(b.dataset.color));
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  currentBox = b.dataset.box;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t===b));
  render();
});
$("cancelBtn").onclick = closeEditor;
$("modal").onclick = e => { if(e.target === $("modal")) closeEditor(); };

$("saveBtn").onclick = () => {
  const now = Date.now();
  let item;
  if(editing){
    item = data.find(x=>x.id===editing);
    item.title = $("title").value.trim()||"未命名胶囊";
    item.letterDate = $("letterDate").value;
    item.box = $("box").value;
    item.unlockDate = $("unlockDate").value;
    item.color = chosenColor;
    item.content = $("content").value;
    item.updated = now;
  } else {
    item = {
      id: String(now),
      title: $("title").value.trim()||"未命名胶囊",
      letterDate: $("letterDate").value,
      box: $("box").value,
      unlockDate: $("unlockDate").value,
      color: chosenColor,
      content: $("content").value,
      updated: now,
      replies: []
    };
    data.unshift(item);
  }
  persist(); closeEditor(); render();
};

// 添加回信逻辑
$("addReplyBtn").onclick = () => {
  const text = $("replyInput").value.trim();
  if(!text) return;
  const x = data.find(v=>v.id===editing);
  if(x){
    if(!x.replies) x.replies = [];
    x.replies.push({text, time: Date.now()});
    persist();
    renderReplies(x);
    $("replyInput").value = "";
    render();
  }
};

$("deleteBtn").onclick = () => {
  if(editing && confirm("真的要把这个胶囊丢掉吗？")){
    data = data.filter(x=>x.id!==editing);
    persist(); closeEditor(); render();
  }
};

$("search").oninput = render;
document.addEventListener("keydown", e => {
  if(e.key === "Escape") closeEditor();
  if((e.ctrlKey || e.metaKey) && e.key === "s" && $("modal").classList.contains("open")){
    e.preventDefault();
    $("saveBtn").click();
  }
});

render();
</script>
</body>
</html>
